<!-- [PLACEHOLDER] OG Image preview sementara 1200x630 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#e5e7eb"/>
  
  <!-- Outer Card -->
  <rect x="60" y="60" width="1080" height="510" rx="40" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  
  <!-- Oat Inner Panel -->
  <rect x="100" y="100" width="1000" height="430" rx="24" fill="#e9dfd2" stroke="#000000" stroke-width="3"/>
  
  <!-- Brand pill tag -->
  <rect x="140" y="140" width="220" height="44" rx="22" fill="#72a4f2" stroke="#000000" stroke-width="2"/>
  <text x="250" y="168" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#202020" text-anchor="middle">Bimbing.in</text>
  
  <!-- Tagline eyebrow -->
  <text x="140" y="230" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="600" fill="#202020">Teman Belajar, Teman Bertumbuh.</text>
  
  <!-- Headline -->
  <text x="140" y="300" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="48" font-weight="800" fill="#202020">Bimbingan akademik yang jelas,</text>
  <text x="140" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="48" font-weight="800" fill="#202020">langkah demi langkah.</text>
  
  <!-- Categories Pill row -->
  <rect x="140" y="420" width="180" height="48" rx="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="230" y="450" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="middle">Programming</text>
  
  <rect x="340" y="420" width="210" height="48" rx="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="445" y="450" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="middle">Database &amp; Data</text>
  
  <rect x="570" y="420" width="160" height="48" rx="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="650" y="450" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="middle">UI/UX Design</text>
  
  <rect x="750" y="420" width="140" height="48" rx="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="820" y="450" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="middle">IoT Project</text>
</svg>
